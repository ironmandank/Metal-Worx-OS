name: Publish editable quote header fields

on:
  push:
    paths:
      - ".github/workflows/codex-quote-header-editor.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply tested update
        run: |
          git config user.name "Metal Worx OS Publisher"
          git config user.email "actions@users.noreply.github.com"
          base64 --decode quote-header-editor.patch.b64 | git apply
          git add app/src/pages/QuoteBuilder.jsx app/src/pages/QuotePreview.jsx
          git commit -m "Make quote header details editable"
          git rm quote-header-editor.patch.b64 .github/workflows/codex-quote-header-editor.yml
          git commit -m "Remove temporary quote header publishing files"
          git push origin HEAD:main
