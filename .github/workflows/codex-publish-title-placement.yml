name: Publish document type title placement fix

on:
  push:
    paths:
      - ".github/workflows/codex-publish-title-placement.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply tested title placement patch
        run: |
          git config user.name "Metal Worx OS Publisher"
          git config user.email "actions@users.noreply.github.com"
          base64 --decode title-placement.patch.b64 > title-placement.patch
          git am title-placement.patch
          rm title-placement.patch
          git rm title-placement.patch.b64 .github/workflows/codex-publish-title-placement.yml
          git commit -m "Remove temporary title placement publishing files"
          git push origin HEAD:main
