name: Publish hot artwork fulfillment

on:
  push:
    paths:
      - ".github/workflows/codex-publish-hot-artwork-fulfillment.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply tested fulfillment patch
        run: |
          echo '' | base64 -d | gunzip > /tmp/hot-artwork-fulfillment.patch
          git config user.name "Metal Worx OS Publisher"
          git config user.email "actions@users.noreply.github.com"
          git am /tmp/hot-artwork-fulfillment.patch
          git rm .github/workflows/codex-publish-hot-artwork-fulfillment.yml
          git commit -m "Remove temporary hot artwork fulfillment publishing workflow"
          git push origin HEAD:main
