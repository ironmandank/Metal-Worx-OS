name: Publish quote line-break fix

on:
  push:
    paths:
      - ".github/workflows/codex-quote-linebreak.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply tested fix
        run: |
          git config user.name "Metal Worx OS Publisher"
          git config user.email "actions@users.noreply.github.com"
          base64 --decode quote-linebreak-fix.patch.b64 | git apply
          git add app/src/pages/QuotePreview.jsx
          git commit -m "Normalize quote line breaks across previews"
          git rm quote-linebreak-fix.patch.b64 .github/workflows/codex-quote-linebreak.yml
          git commit -m "Remove temporary quote publishing files"
          git push origin HEAD:main
