name: Publish Project Billing navigation
on:
  push:
    paths:
      - ".github/workflows/codex-publish-billing-nav.yml"
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply tested navigation patch
        run: |
          echo '' | base64 -d | gunzip > /tmp/billing-nav.patch
          git config user.name "Metal Worx OS Publisher"
          git config user.email "actions@users.noreply.github.com"
          git am /tmp/billing-nav.patch
          git rm .github/workflows/codex-publish-billing-nav.yml
          git commit -m "Remove temporary billing navigation publishing workflow"
          git push origin HEAD:main
