name: Publish editable project billing
on:
  push:
    paths:
      - ".github/workflows/codex-publish-editable-billing.yml"
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply tested editable billing patch
        run: |
          echo '' | base64 -d | gunzip > /tmp/editable-billing.patch
          git config user.name "Metal Worx OS Publisher"
          git config user.email "actions@users.noreply.github.com"
          git am /tmp/editable-billing.patch
          git rm .github/workflows/codex-publish-editable-billing.yml
          git commit -m "Remove temporary editable billing publishing workflow"
          git push origin HEAD:main
