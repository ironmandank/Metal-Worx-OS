name: Publish selectable quote and invoice documents

on:
  push:
    paths:
      - ".github/workflows/codex-publish-document-type.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply tested document-type patch
        run: |
          git config user.name "Metal Worx OS Publisher"
          git config user.email "actions@users.noreply.github.com"
          base64 --decode document-type.patch.b64 > document-type.patch
          git am document-type.patch
          rm document-type.patch
          git rm document-type.patch.b64 .github/workflows/codex-publish-document-type.yml
          git commit -m "Remove temporary document-type publishing files"
          git push origin HEAD:main
