name: Publish prepared Metal Worx OS commits

on:
  push:
    paths:
      - ".github/workflows/codex-publish-prepared.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply tested commits
        run: |
          git config user.name "Metal Worx OS Publisher"
          git config user.email "actions@users.noreply.github.com"
          base64 --decode metal-worx-publish.bundle.b64 > metal-worx-publish.bundle
          git fetch ./metal-worx-publish.bundle refs/heads/publish-design-images:refs/remotes/bundle/publish-design-images
          git cherry-pick 306e0e3 e27df92 282688e
          rm metal-worx-publish.bundle
          git rm metal-worx-publish.bundle.b64 .github/workflows/codex-publish-prepared.yml
          git commit -m "Remove temporary publishing files"
          git push origin HEAD:main
